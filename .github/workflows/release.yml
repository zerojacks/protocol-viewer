name: Desktop Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  build-linux:
    name: Linux x86_64
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            pkg-config libfontconfig1-dev libfreetype-dev libudev-dev \
            libx11-dev libxcb1-dev libxcb-render0-dev libxcb-shape0-dev \
            libxcb-xfixes0-dev libxcb-icccm4-dev libxcb-keysyms1-dev \
            libxcb-randr0-dev libxcb-util-dev libxkbcommon-dev \
            libxkbcommon-x11-dev libwayland-dev libvulkan-dev

      - name: Install Rust nightly
        uses: dtolnay/rust-toolchain@nightly

      - name: Cache Cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: linux-x86_64-${{ hashFiles('Cargo.lock') }}
          restore-keys: linux-x86_64-

      - name: Build
        run: cargo build --locked --release --bin protocol-viewer

      - name: Package
        shell: bash
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          sh packaging/linux/build-deb.sh "$VERSION"

      - uses: actions/upload-artifact@v4
        with:
          name: protocol-viewer-linux-x86_64
          path: dist/*.deb
          if-no-files-found: error

  build-windows:
    name: Windows x86_64
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust nightly
        uses: dtolnay/rust-toolchain@nightly

      - name: Cache Cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: windows-x86_64-${{ hashFiles('Cargo.lock') }}
          restore-keys: windows-x86_64-

      - name: Build
        run: cargo build --locked --release --bin protocol-viewer

      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup --no-progress --yes

      - name: Package
        shell: pwsh
        run: |
          $version = "${env:GITHUB_REF_NAME}" -replace '^v', ''
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" `
            "/DAppVersion=$version" `
            "/DSourceDir=$((Get-Location).Path)\target\release" `
            "/DOutputDir=$((Get-Location).Path)\dist" `
            "packaging\windows\ProtocolViewer.iss"

      - uses: actions/upload-artifact@v4
        with:
          name: protocol-viewer-windows-x86_64
          path: dist/*-setup.exe
          if-no-files-found: error

  build-macos-x86_64:
    name: macOS x86_64
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust nightly
        uses: dtolnay/rust-toolchain@nightly
        with:
          targets: x86_64-apple-darwin

      - name: Cache Cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: macos-x86_64-${{ hashFiles('Cargo.lock') }}
          restore-keys: macos-x86_64-

      - name: Build
        run: cargo build --locked --release --bin protocol-viewer --target x86_64-apple-darwin

      - name: Package
        shell: bash
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          APP_VERSION="$VERSION" TARGET_TRIPLE=x86_64-apple-darwin sh packaging/macos/build-app-bundle.sh
          APP_VERSION="$VERSION" DARWIN_ARCH=x86_64 sh packaging/macos/build-dmg.sh

      - uses: actions/upload-artifact@v4
        with:
          name: protocol-viewer-macos-x86_64
          path: dist/*.dmg
          if-no-files-found: error

  build-macos-aarch64:
    name: macOS Apple Silicon
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust nightly
        uses: dtolnay/rust-toolchain@nightly
        with:
          targets: aarch64-apple-darwin

      - name: Cache Cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: macos-aarch64-${{ hashFiles('Cargo.lock') }}
          restore-keys: macos-aarch64-

      - name: Build
        run: cargo build --locked --release --bin protocol-viewer --target aarch64-apple-darwin

      - name: Package
        shell: bash
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          APP_VERSION="$VERSION" TARGET_TRIPLE=aarch64-apple-darwin sh packaging/macos/build-app-bundle.sh
          APP_VERSION="$VERSION" DARWIN_ARCH=aarch64 sh packaging/macos/build-dmg.sh

      - uses: actions/upload-artifact@v4
        with:
          name: protocol-viewer-macos-aarch64
          path: dist/*.dmg
          if-no-files-found: error

  release:
    name: Publish GitHub Release
    needs:
      - build-linux
      - build-windows
      - build-macos-x86_64
      - build-macos-aarch64
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: List release assets
        run: ls -lh dist

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: dist/*