[package]
name = "protocol-viewer-web"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib"]

[dependencies]
# WASM 绑定
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
web-sys = { version = "0.3", features = [
    "Window",
    "Document",
    "HtmlCanvasElement",
    "WebGl2RenderingContext",
    "Navigator",
] }
console_error_panic_hook = "0.1"
console_log = "1.0"
log = "0.4"
tracing-wasm = "0.2"

# GPUI Kit（同时提供 GPUI、组件和平台层）
gpui-kit = { version = "0.6", default-features = false, features = ["component"] }

# 主项目
protocol-viewer = { path = ".." }

[profile.release]
opt-level = "z"     # 优化大小
lto = true          # 链接时优化
codegen-units = 1   # 更好的优化
