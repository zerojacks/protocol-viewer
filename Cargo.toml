[package]
name = "protocol-viewer"
version = "0.1.0"
edition = "2021"

[lib]
name = "protocol_viewer"
path = "src/lib.rs"

[[bin]]
name = "protocol-viewer"
path = "src/main.rs"

[dependencies]
# GPUI Kit 框架 - 统一的桌面应用框架
gpui-kit = "0.6"

# 协议解析器
protocol-parser = { path = "../protocol-parser/parser" }

# 工具库
anyhow = "1"
